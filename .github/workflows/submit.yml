name: submit

# Daily continuous forecast to Predico (t0-gamma D+1, climatology D+2..D+10).
# Runs at 13:00 UTC (after OMIE day-ahead results) and retries at 14:00 UTC; the latest
# submission counts. Gate: 17:00 CET D-1 (16:00 UTC), session open the hour before. At 15:15,
# 15:30 and 15:45 UTC --check resubmits if an open challenge isn't covered.
on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    - cron: "15,30,45 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Forecast only, no HF upload or Predico submission"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-t0-gamma
      - run: uv sync --no-dev --extra t0
      - run: uv run python -m openpredico.live.submit ${{ inputs.dry_run && '--dry-run' || '' }} ${{ github.event.schedule == '15,30,45 15 * * *' && '--check' || '' }}
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PREDICO_EMAIL: ${{ secrets.PREDICO_EMAIL }}
          PREDICO_PASSWORD: ${{ secrets.PREDICO_PASSWORD }}
          PREDICO_URL: ${{ vars.PREDICO_URL }}
