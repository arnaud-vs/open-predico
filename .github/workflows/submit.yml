name: submit

# Daily continuous forecast to Predico. Runs at 13:00 UTC (after OMIE day-ahead results)
# and retries at 14:00 UTC; the latest submission counts. Gate: 17:00 CET/CEST D-1.
on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Forecast only, no HF upload or Predico submission"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run python -m openpredico.live.submit ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PREDICO_EMAIL: ${{ secrets.PREDICO_EMAIL }}
          PREDICO_PASSWORD: ${{ secrets.PREDICO_PASSWORD }}
          PREDICO_URL: ${{ vars.PREDICO_URL }}
