name: 50Hertz collector check (isolated branch)

# No schedule, secrets, uploads or Predico access. Runs only on our development branch.
on:
  push:
    branches: [codex/fiftyhertz-wind-connector]

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Fetch latest complete day of public 50Hertz actuals
        run: uv run python examples/check_fiftyhertz.py
