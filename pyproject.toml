[project]
name = "openpredico"
version = "0.0.1"
description = "Open-source forecasting and benchmarking for the Predico collaborative forecasting platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub>=0.34",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
]

[project.optional-dependencies]
# ponytail: not on PyPI; unpinned GitHub install. Pin a commit once one is validated.
timestral = ["timestral @ git+https://github.com/mistralai/timestral.git"]
chronos2 = ["chronos-forecasting==2.3.2"]
timesfm = ["timesfm[torch]==3.0.2"]  # TimesFM 3.0 weights: non-commercial licence
t0 = ["tfc-t0[torch]==0.6.0"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
