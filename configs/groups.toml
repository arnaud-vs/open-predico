ntc_fr_export = { source = "esios:1848", availability = "future" }
ntc_pt_import = { source = "esios:1845", availability = "future" }
ntc_pt_export = { source = "esios:1849", availability = "future" }
p48_net_fr = { source = "esios:10015", availability = "past" }
p48_net_pt = { source = "esios:10014", availability = "past" }

[calendar]
qh_of_day = { source = "calendar:qh_of_day", availability = "future" }
weekday = { source = "calendar:weekday", availability = "future" }
holiday_es = { source = "calendar:holiday_es", availability = "future" }
dst_switch_day = { source = "calendar:dst_switch_day", availability = "future" }

# --- 50Hertz control area (ENTSO-E 10YDE-VE-------2): germany_wind/solar_50hertz_ca ---
[target_50hertz]  # ENTSO-E A75 actual generation, MW: Predico's truth for both targets
wind_50hertz = { source = "entsoe:A75_B18+B19", availability = "past" }  # offshore + onshore
solar_50hertz = { source = "entsoe:A75_B16", availability = "past" }
wind_50hertz_offshore = { source = "entsoe:A75_B18", availability = "past" }
wind_50hertz_onshore = { source = "entsoe:A75_B19", availability = "past" }

[entsoe_forecasts_50hertz]  # ENTSO-E day-ahead forecasts, MW
# A69 is due by 18:00 D-1 (after the 15:00 gate; not yet out at 10:12 on 2026-11-08): past only
wind_offshore_forecast_50hertz = { source = "entsoe:A69_B18", availability = "past" }
wind_onshore_forecast_50hertz = { source = "entsoe:A69_B19", availability = "past" }
solar_forecast_50hertz = { source = "entsoe:A69_B16", availability = "past" }
# A65 is due by 10:00 D-1 (2 h before the day-ahead auction; out by 10:12 on 2026-11-08)
load_forecast_50hertz = { source = "entsoe:A65", availability = "future" }

[weather_50hertz]  # Open-Meteo ECMWF IFS, 00 UTC run of D-1 (data/openmeteo.py), area means
wind_speed_100m = { source = "openmeteo:land.wind_speed_100m", availability = "future" }  # m/s
wind_speed_10m = { source = "openmeteo:land.wind_speed_10m", availability = "future" }
wind_speed_100m_offshore = { source = "openmeteo:offshore.wind_speed_100m", availability = "future" }
ghi = { source = "openmeteo:land.shortwave_radiation", availability = "future" }  # W/m2
direct_radiation = { source = "openmeteo:land.direct_radiation", availability = "future" }
diffuse_radiation = { source = "openmeteo:land.diffuse_radiation", availability = "future" }
cloud_cover = { source = "openmeteo:land.cloud_cover", availability = "future" }  # %
temperature_2m = { source = "openmeteo:land.temperature_2m", availability = "future" }  # °C

[calendar_de]
holiday_de = { source = "calendar:holiday_de", availability = "future" }
