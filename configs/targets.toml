# One entry per forecasting target. See PLAN.md > Targets.
#
# kind:   "market"     -> no clipping, values may be negative
#         "generation" -> clipped to [0, capacity]
# origin: local time on D-1 when the forecast is made (the live run is later: 14:15 for a
#         15:00 gate, 16:15 for 17:00; live/modal_app.py)
# intraday (optional): Predico's hourly challenges; live submits every hour, from now
# gate:   local time on D-1 when Predico closes the D+1 session
# column: the target's column in `groups`, whose source is `truth`
# groups: feature groups (configs/groups.toml) the target's models see

[spain_mfrr_energy]
predico_resource = "spain_mfrr_energy"
truth = "esios:10250"
column = "mfrr_energy"
groups = [
    "target",
    "mfrr",
    "da_market",
    "ree_forecasts",
    "balancing",
    "xborder",
    "calendar",
    "calendar_es",
]
unit = "MWh"
kind = "market"
timezone = "Europe/Madrid"
origin = "14:00"
gate = "17:00"
test_period = ["2025-11-01", "2026-10-31"]

[spain_mfrr_price]
predico_resource = "spain_mfrr_price"
truth = "esios:2197"
column = "mfrr_price"
groups = [
    "target",
    "mfrr",
    "da_market",
    "ree_forecasts",
    "balancing",
    "xborder",
    "calendar",
    "calendar_es",
]
unit = "EUR/MWh"
kind = "market"
timezone = "Europe/Madrid"
origin = "14:00"
gate = "17:00"
test_period = ["2025-11-01", "2026-10-31"]

[germany_wind_50hertz_ca]
predico_resource = "germany_wind_50hertz_ca"
# Predico's truth: ENTSO-E A75 B18 + B19 (offshore + onshore), 10YDE-VE-------2, each series
# carried forward before summing (data/entsoe.py)
truth = "entsoe:A75_B18+B19"
column = "wind_50hertz"
groups = [
    "target_50hertz",
    "entsoe_forecasts_50hertz",
    "weather_50hertz",
    "calendar",
    "calendar_de",
]
unit = "MW"
kind = "generation"
capacity = 24500  # ponytail: ENTSO-E A68 installed capacity for 2026 (1828 + 22629 MW)
# ENTSO-E A69 day-ahead forecast (point only: q10 = q90 = q50), scored as config entsoe_a69
tso = { q50 = "wind_offshore_forecast_50hertz+wind_onshore_forecast_50hertz" }
timezone = "Europe/Berlin"
origin = "14:00"
gate = "15:00"
test_period = ["2025-11-01", "2026-10-31"]

[germany_solar_50hertz_ca]
predico_resource = "germany_solar_50hertz_ca"
truth = "entsoe:A75_B16"  # Predico's truth: ENTSO-E A75 B16, 10YDE-VE-------2
column = "solar_50hertz"
groups = [
    "target_50hertz",
    "entsoe_forecasts_50hertz",
    "weather_50hertz",
    "calendar",
    "calendar_de",
]
unit = "MW"
kind = "generation"
capacity = 25300  # ponytail: ENTSO-E A68 installed capacity for 2026 (25235 MW)
# ENTSO-E A69 day-ahead forecast (point only: q10 = q90 = q50), scored as config entsoe_a69
tso = { q50 = "solar_forecast_50hertz" }
timezone = "Europe/Berlin"
origin = "14:00"
gate = "15:00"
test_period = ["2025-11-01", "2026-10-31"]

[belgium_solar_opendata_elia]
predico_resource = "belgium_solar_opendata_elia"
truth = "elia:solar.measured"  # Predico's truth: ods032, then ods209/ods210 Total (data/elia.py)
column = "solar_be"
groups = ["target_elia", "weather_be", "weather_be_d2", "weather_be_knmi", "weather_be_aifs", "capacity_be", "calendar"]
unit = "MW"
kind = "generation"
capacity = 13000  # ponytail: Elia monitored capacity, Total, Nov 2026 (12601 MW); max seen 8559
timezone = "Europe/Brussels"
origin = "09:00"  # D+1 gate 10:00 Brussels (Predico's Elia program)
gate = "10:00"
# Predico also opens a challenge every hour (gate at the next full hour, the next 24 h): live
# submits every hour, forecast from now (live/submit.py `in_session`, `forecast`)
intraday = true
test_period = ["2025-11-01", "2026-10-25"]  # weather benchmark v4 ends 2026-10-25
# Elia's forecast (Predico's owner benchmark), scored as config elia_dayahead11h
tso = { q10 = "tso_q10_be", q50 = "tso_q50_be", q90 = "tso_q90_be" }
