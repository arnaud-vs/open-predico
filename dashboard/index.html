<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>open-predico</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.js";
      mount(
        { requirements: ["altair", "fastparquet"], entrypoint: "app.py", files: { "app.py": { url: "./app.py" } } },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
